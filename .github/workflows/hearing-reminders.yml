name: Send hearing reminders

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:

concurrency:
  group: hearing-reminders
  cancel-in-progress: false

jobs:
  send-reminders:
    if: ${{ vars.HEARING_REMINDERS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Trigger due email reminders
        env:
          REMINDER_CRON_SECRET: ${{ secrets.REMINDER_CRON_SECRET }}
        run: |
          if [ -z "$REMINDER_CRON_SECRET" ]; then
            echo "REMINDER_CRON_SECRET is not configured. Skipping reminder dispatch."
            exit 0
          fi
          curl --fail-with-body --silent --show-error \
            --max-time 30 \
            --header "Authorization: Bearer $REMINDER_CRON_SECRET" \
            "https://barr-henry-law-council.vercel.app/api/v1/cron/hearing-reminders"
